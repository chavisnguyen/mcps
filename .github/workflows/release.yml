name: Release assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.5.3)'
        required: true
        default: 'v0.5.3'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard - package version matches release tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          grep -E "version[[:space:]]*=[[:space:]]*\"${VERSION}\"" main.go
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -v -count=1 ./...

  binaries:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archives & checksums
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p release-assets staging
          for t in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${t%/*}; arch=${t#*/}
            rm -rf staging/*
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags="-s -w -X main.version=${VERSION}" -o staging/mcps .
            cp LICENSE staging/
            tar -czf "release-assets/mcps-${os}-${arch}.tar.gz" -C staging mcps LICENSE
          done
          (cd release-assets && sha256sum mcps-*.tar.gz > checksums.txt && cat checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "mcps $TAG" --generate-notes
          gh release upload "$TAG" release-assets/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: release-assets/checksums.txt

  bump-formula:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: .
      - name: Bump Formula/mcps.rb
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="$TAG" python3 - << 'PYEOF'
          import os, re

          sums = {}
          for line in open("checksums.txt"):
              parts = line.split()
              if len(parts) >= 2:
                  sums[parts[1]] = parts[0]

          p = "Formula/mcps.rb"
          s = open(p).read()
          tag = os.environ["TAG"]
          for name, sha in sums.items():
              s = re.sub(
                  r"https://github\.com/chavisnguyen/mcps/releases/download/[^/\"']+/" + re.escape(name),
                  f"https://github.com/chavisnguyen/mcps/releases/download/{tag}/{name}",
                  s,
              )
              s = re.sub(r'(' + re.escape(name) + r'"\n\s*sha256 ")[0-9a-f]{64}', rf"\g<1>{sha}", s)
          open(p, "w").write(s)
          PYEOF

          git diff --stat
          git add Formula/mcps.rb
          git -c "user.name=mcps-bot" -c "user.email=mcps-bot@users.noreply.github.com" \
            commit -m "chore(formula): bump to ${TAG}" && git push || echo "nothing to bump"
