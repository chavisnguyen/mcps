name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          for t in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${t%/*}; arch=${t#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o mcps .
            tar czf mcps_${GITHUB_REF_NAME#v}_${os}_${arch}.tar.gz mcps LICENSE 2>/dev/null || tar czf mcps_${GITHUB_REF_NAME#v}_${os}_${arch}.tar.gz mcps
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes mcps_*.tar.gz
