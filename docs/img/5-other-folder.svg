<text x="442.0" y="22" fill="#a1a1aa" font-size="12" text-anchor="middle">my-api</text>
<text x="20.00" y="52.00" fill="#4ade80" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">$</text>
<text x="28.45" y="52.00" fill="#d4d4d8" xml:space="preserve" textLength="836.55" lengthAdjust="spacing"> mcps                                                                                              </text>
<text x="20.00" y="71.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">mcps keeps all your MCP servers in one list and sets them up for every AI tool you use.             </text>
<text x="20.00" y="109.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">This folder                                                                                         </text>
<text x="20.00" y="128.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">~/my-api                                                                                            </text>
<text x="20.00" y="147.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">Which MCP servers should this project use?                                                          </text>
<text x="20.00" y="166.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">↑/↓ move · space tick/untick · ←/→ none/all · enter confirm · ctrl+c cancel                         </text>
<text x="20.00" y="185.00" fill="#67e8f9" xml:space="preserve" textLength="194.35" lengthAdjust="spacing">Servers for this folder</text>
<text x="214.35" y="185.00" fill="#d4d4d8" xml:space="preserve" textLength="650.65" lengthAdjust="spacing">:                                                                            </text>
<text x="20.00" y="204.00" fill="#d4d4d8" xml:space="preserve" textLength="25.35" lengthAdjust="spacing">  [</text>
<text x="45.35" y="204.00" fill="#f87171" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">✗</text>
<text x="53.80" y="204.00" fill="#d4d4d8" xml:space="preserve" textLength="811.20" lengthAdjust="spacing">] browser  http://localhost:3025/mcp                                                            </text>
<text x="20.00" y="223.00" fill="#d4d4d8" xml:space="preserve" textLength="25.35" lengthAdjust="spacing">  [</text>
<text x="45.35" y="223.00" fill="#f87171" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">✗</text>
<text x="53.80" y="223.00" fill="#d4d4d8" xml:space="preserve" textLength="811.20" lengthAdjust="spacing">] figma    https://mcp.figma.com/mcp                                                            </text>
<text x="20.00" y="242.00" fill="#d4d4d8" xml:space="preserve" textLength="25.35" lengthAdjust="spacing">  [</text>
<text x="45.35" y="242.00" fill="#f87171" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">✗</text>
<text x="53.80" y="242.00" fill="#d4d4d8" xml:space="preserve" textLength="811.20" lengthAdjust="spacing">] github   npx -y @modelcontextprotocol/server-github                                           </text>
<text x="20.00" y="261.00" fill="#d4d4d8" xml:space="preserve" textLength="25.35" lengthAdjust="spacing">  [</text>
<text x="45.35" y="261.00" fill="#4ade80" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">✓</text>
<text x="53.80" y="261.00" fill="#d4d4d8" xml:space="preserve" textLength="811.20" lengthAdjust="spacing">] notion   https://mcp.notion.com/mcp                                                           </text>
<text x="20.00" y="280.00" fill="#d4d4d8" xml:space="preserve" textLength="25.35" lengthAdjust="spacing">  [</text>
<text x="45.35" y="280.00" fill="#f87171" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">✗</text>
<text x="53.80" y="280.00" fill="#d4d4d8" xml:space="preserve" textLength="811.20" lengthAdjust="spacing">] sentry   npx -y @sentry/mcp-server                                                            </text>
<text x="20.00" y="299.00" fill="#d8b4fe" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">❯</text>
<text x="28.45" y="299.00" fill="#d4d4d8" xml:space="preserve" textLength="16.90" lengthAdjust="spacing"> [</text>
<text x="45.35" y="299.00" fill="#4ade80" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">✓</text>
<text x="53.80" y="299.00" fill="#d4d4d8" xml:space="preserve" textLength="811.20" lengthAdjust="spacing">] slack    http://localhost:3010/mcp                                                            </text>
<text x="20.00" y="318.00" fill="#d8b4fe" xml:space="preserve" textLength="59.15" lengthAdjust="spacing">space: </text>
<text x="79.15" y="318.00" fill="#d8b4fe" font-weight="bold" xml:space="preserve" textLength="50.70" lengthAdjust="spacing">select</text>
<text x="129.85" y="318.00" fill="#d8b4fe" xml:space="preserve" textLength="84.50" lengthAdjust="spacing"> | enter: </text>
<text x="214.35" y="318.00" fill="#d8b4fe" font-weight="bold" xml:space="preserve" textLength="59.15" lengthAdjust="spacing">confirm</text>
<text x="273.50" y="318.00" fill="#d8b4fe" xml:space="preserve" textLength="76.05" lengthAdjust="spacing"> | left: </text>
