<svg xmlns="http://www.w3.org/2000/svg" width="884" height="349" viewBox="0 0 884 349" font-family="SF Mono, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14">
<rect width="884" height="349" rx="10" fill="#18181b"/>
