<svg xmlns="http://www.w3.org/2000/svg" width="884" height="330" viewBox="0 0 884 330" font-family="SF Mono, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14">
<rect width="884" height="330" rx="10" fill="#18181b"/>
<rect width="884" height="34" rx="10" fill="#27272a"/><rect y="24" width="884" height="10" fill="#27272a"/>
<circle cx="20" cy="17" r="6" fill="#ef4444"/><circle cx="40" cy="17" r="6" fill="#f59e0b"/><circle cx="60" cy="17" r="6" fill="#22c55e"/>
<text x="442.0" y="22" fill="#a1a1aa" font-size="12" text-anchor="middle">my-app</text>
<text x="20.00" y="52.00" fill="#4ade80" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">$</text>
<text x="28.45" y="52.00" fill="#d4d4d8" xml:space="preserve" textLength="836.55" lengthAdjust="spacing"> mcps                                                                                              </text>
<text x="20.00" y="71.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">mcps keeps all your MCP servers in one list and sets them up for every AI tool you use.             </text>
<text x="20.00" y="109.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">Step 1/2 · Your MCP servers                                                                         </text>
<text x="20.00" y="128.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">I found 5 MCP server(s) already set up in your AI tools (Claude Code, Codex).                       </text>
<text x="20.00" y="147.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">Choose the ones to add to mcps. Nothing is removed from those tools.                                </text>
<text x="20.00" y="166.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">↑/↓ move · space tick/untick · ←/→ none/all · enter confirm · ctrl+c cancel                         </text>
<text x="20.00" y="185.00" fill="#67e8f9" xml:space="preserve" textLength="92.95" lengthAdjust="spacing">Add to mcps</text>
<text x="112.95" y="185.00" fill="#d4d4d8" xml:space="preserve" textLength="752.05" lengthAdjust="spacing">:                                                                                        </text>
<text x="20.00" y="204.00" fill="#d8b4fe" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">❯</text>
<text x="28.45" y="204.00" fill="#d4d4d8" xml:space="preserve" textLength="16.90" lengthAdjust="spacing"> [</text>
<text x="45.35" y="204.00" fill="#4ade80" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">✓</text>
<text x="53.80" y="204.00" fill="#d4d4d8" xml:space="preserve" textLength="811.20" lengthAdjust="spacing">] browser   [Claude Code, Codex]  http://localhost:3025/mcp                                     </text>
<text x="20.00" y="223.00" fill="#d4d4d8" xml:space="preserve" textLength="25.35" lengthAdjust="spacing">  [</text>
<text x="45.35" y="223.00" fill="#4ade80" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">✓</text>
<text x="53.80" y="223.00" fill="#d4d4d8" xml:space="preserve" textLength="811.20" lengthAdjust="spacing">] figma     [Claude Code, Codex]  https://mcp.figma.com/mcp                                     </text>
<text x="20.00" y="242.00" fill="#d4d4d8" xml:space="preserve" textLength="25.35" lengthAdjust="spacing">  [</text>
<text x="45.35" y="242.00" fill="#4ade80" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">✓</text>
<text x="53.80" y="242.00" fill="#d4d4d8" xml:space="preserve" textLength="811.20" lengthAdjust="spacing">] github    [Claude Code]  npx -y @modelcontextprotocol/server-github                           </text>
<text x="20.00" y="261.00" fill="#d4d4d8" xml:space="preserve" textLength="25.35" lengthAdjust="spacing">  [</text>
<text x="45.35" y="261.00" fill="#f87171" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">✗</text>
<text x="53.80" y="261.00" fill="#d4d4d8" xml:space="preserve" textLength="811.20" lengthAdjust="spacing">] postgres  [Claude Code]  npx -y @modelcontextprotocol/server-postgres                         </text>
<text x="20.00" y="280.00" fill="#d4d4d8" xml:space="preserve" textLength="25.35" lengthAdjust="spacing">  [</text>
<text x="45.35" y="280.00" fill="#4ade80" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">✓</text>
<text x="53.80" y="280.00" fill="#d4d4d8" xml:space="preserve" textLength="811.20" lengthAdjust="spacing">] slack     [Claude Code]  http://localhost:3010/mcp                                            </text>
<text x="20.00" y="299.00" fill="#d8b4fe" xml:space="preserve" textLength="59.15" lengthAdjust="spacing">space: </text>
<text x="79.15" y="299.00" fill="#d8b4fe" font-weight="bold" xml:space="preserve" textLength="50.70" lengthAdjust="spacing">select</text>
<text x="129.85" y="299.00" fill="#d8b4fe" xml:space="preserve" textLength="84.50" lengthAdjust="spacing"> | enter: </text>
<text x="214.35" y="299.00" fill="#d8b4fe" font-weight="bold" xml:space="preserve" textLength="59.15" lengthAdjust="spacing">confirm</text>
<text x="273.50" y="299.00" fill="#d8b4fe" xml:space="preserve" textLength="76.05" lengthAdjust="spacing"> | left: </text>
