<svg xmlns="http://www.w3.org/2000/svg" width="884" height="577" viewBox="0 0 884 577" font-family="SF Mono, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14">
<rect width="884" height="577" rx="10" fill="#18181b"/>
<rect width="884" height="34" rx="10" fill="#27272a"/><rect y="24" width="884" height="10" fill="#27272a"/>
<circle cx="20" cy="17" r="6" fill="#ef4444"/><circle cx="40" cy="17" r="6" fill="#f59e0b"/><circle cx="60" cy="17" r="6" fill="#22c55e"/>
<text x="442.0" y="22" fill="#a1a1aa" font-size="12" text-anchor="middle">my-app</text>
<text x="20.00" y="52.00" fill="#4ade80" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">$</text>
<text x="28.45" y="52.00" fill="#d4d4d8" xml:space="preserve" textLength="836.55" lengthAdjust="spacing"> mcps                                                                                              </text>
<text x="20.00" y="71.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">mcps keeps all your MCP servers in one list and sets them up for every AI tool you use.             </text>
<text x="20.00" y="109.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">Step 1/2 · Your MCP servers                                                                         </text>
<text x="20.00" y="128.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">I found 5 MCP server(s) already set up in your AI tools (Claude Code, Codex).                       </text>
<text x="20.00" y="147.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">Choose the ones to add to mcps. Nothing is removed from those tools.                                </text>
<text x="20.00" y="166.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">↑/↓ move · space tick/untick · ←/→ none/all · enter confirm · ctrl+c cancel                         </text>
<text x="20.00" y="185.00" fill="#67e8f9" xml:space="preserve" textLength="92.95" lengthAdjust="spacing">Add to mcps</text>
<text x="112.95" y="185.00" fill="#d4d4d8" xml:space="preserve" textLength="752.05" lengthAdjust="spacing">:                                                                                        </text>
<text x="36.90" y="204.00" fill="#d8b4fe" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">❯</text>
<text x="45.35" y="204.00" fill="#d4d4d8" xml:space="preserve" textLength="819.65" lengthAdjust="spacing"> browser   [Claude Code, Codex]  http://localhost:3025/mcp                                       </text>
<text x="36.90" y="223.00" fill="#d8b4fe" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">❯</text>
<text x="45.35" y="223.00" fill="#d4d4d8" xml:space="preserve" textLength="819.65" lengthAdjust="spacing"> figma     [Claude Code, Codex]  https://mcp.figma.com/mcp                                       </text>
<text x="36.90" y="242.00" fill="#d8b4fe" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">❯</text>
<text x="45.35" y="242.00" fill="#d4d4d8" xml:space="preserve" textLength="819.65" lengthAdjust="spacing"> github    [Claude Code]  npx -y @modelcontextprotocol/server-github                             </text>
<text x="36.90" y="261.00" fill="#d8b4fe" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">❯</text>
<text x="45.35" y="261.00" fill="#d4d4d8" xml:space="preserve" textLength="819.65" lengthAdjust="spacing"> slack     [Claude Code]  http://localhost:3010/mcp                                              </text>
<text x="20.00" y="299.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">Added 4 MCP server(s) to the mcps list (~/.mcps/config/servers.toml).                               </text>
<text x="20.00" y="318.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">1 API key(s) were stored privately in ~/.mcps/secrets.env instead of the list.                      </text>
<text x="20.00" y="337.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">Check any command arguments that may contain a key: they are copied as-is.                          </text>
<text x="20.00" y="375.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">Step 2/2 · This folder                                                                              </text>
<text x="20.00" y="394.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">~/my-app                                                                                            </text>
<text x="20.00" y="413.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">Which MCP servers should this project use?                                                          </text>
<text x="20.00" y="432.00" fill="#d4d4d8" xml:space="preserve" textLength="845.00" lengthAdjust="spacing">↑/↓ move · space tick/untick · ←/→ none/all · enter confirm · ctrl+c cancel                         </text>
<text x="20.00" y="451.00" fill="#67e8f9" xml:space="preserve" textLength="194.35" lengthAdjust="spacing">Servers for this folder</text>
<text x="214.35" y="451.00" fill="#d4d4d8" xml:space="preserve" textLength="650.65" lengthAdjust="spacing">:                                                                            </text>
