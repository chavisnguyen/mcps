<text x="20.00" y="508.00" fill="#d8b4fe" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">❯</text>
<text x="28.45" y="508.00" fill="#d4d4d8" xml:space="preserve" textLength="16.90" lengthAdjust="spacing"> [</text>
<text x="45.35" y="508.00" fill="#4ade80" xml:space="preserve" textLength="8.45" lengthAdjust="spacing">✓</text>
<text x="53.80" y="508.00" fill="#d4d4d8" xml:space="preserve" textLength="811.20" lengthAdjust="spacing">] github   npx -y @modelcontextprotocol/server-github                                           </text>
<text x="20.00" y="527.00" fill="#d4d4d8" xml:space="preserve" textLength="25.35" lengthAdjust="spacing">  [</text>
